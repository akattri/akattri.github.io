{{ define "main" }}
<div class="container">
  <div class="page-header" style="padding-top: 4rem; padding-bottom: 4rem;">
    <div class="page-meta-lead">404 &middot; Not found</div>
    <h1 class="page-title">Page Not Found</h1>
    <p class="page-description">
      The requested path does not exist in this hierarchy.
    </p>
    <div style="margin-top: 2rem;">
      <a href="{{ "/" | relURL }}" class="action-link">&larr; Return to root index</a>
    </div>
  </div>
</div>
{{ end }}
