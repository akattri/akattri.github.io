{{ define "main" }}
<div class="container">
  <article>
    <header class="article-header">
      {{ if .Date }}
      <div class="article-meta-lead">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        {{ with .Params.tags }}
          <span>·</span>
          <span>{{ delimit . " · " }}</span>
        {{ end }}
      </div>
      {{ end }}

      <h1 class="article-title">{{ .Title }}</h1>
      {{ with .Description }}
        <p class="article-summary">{{ . }}</p>
      {{ end }}
    </header>

    <div class="prose">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
