<header class="site-header" role="banner">
  <div class="container site-header-inner">
    <a href="{{ "/" | relURL }}" class="site-brand home-button" aria-label="Home" title="Home">
      <svg class="home-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>

    <div class="nav-cluster">
      <nav class="site-nav" role="navigation" aria-label="Main Navigation">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
          {{ $isActive := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (and (ne .URL "/") (hasPrefix $currentPage.RelPermalink .URL)) }}
          <a href="{{ .URL | relURL }}" class="nav-link{{ if $isActive }} active{{ end }}" {{ if $isActive }}aria-current="page"{{ end }}>
            {{ .Name }}
          </a>
        {{ end }}
      </nav>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark and light color theme" title="Toggle dark/light theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="sun-icon" viewBox="0 0 24 24" aria-hidden="true" style="display: none;" width="16" height="16">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <line x1="12" y1="2" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="12" y1="20" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="2" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="20" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="moon-icon" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
