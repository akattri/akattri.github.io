<footer class="site-footer" role="contentinfo">
  <div class="container">
    <div class="footer-content">
      <div class="colophon-meta">
        <div>
          <span>{{ .Site.Params.institution }}</span> · 
          <span>{{ .Site.Params.degree }}</span>
        </div>
        <div>
          <span>Kattankulathur, IN</span> · 
          <span>Built with Hugo</span>
        </div>
      </div>

      <div class="colophon-meta">
        <div>
          &copy; {{ now.Format "2006" }} {{ .Site.Params.author }}. All rights reserved.
        </div>
        <ul class="footer-nav">
          <li><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          <li><a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
          <li><a href="{{ .Site.Params.email }}">Email</a></li>
          <li><a href="{{ "index.xml" | relURL }}">RSS</a></li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      var sun = document.getElementById('sun-icon');
      var moon = document.getElementById('moon-icon');

      function syncThemeState() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (sun && moon) {
          sun.style.display = isDark ? 'block' : 'none';
          moon.style.display = isDark ? 'none' : 'block';
        }
      }

      syncThemeState();

      if (toggle) {
        toggle.addEventListener('click', function() {
          var current = document.documentElement.getAttribute('data-theme');
          var target = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', target);
          try {
            localStorage.setItem('theme', target);
          } catch(e) {}
          syncThemeState();
        });
      }

      // Listen for system theme changes if user has not explicitly set a preference
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            syncThemeState();
          }
        });
      } catch(e) {}
    })();
  </script>
</footer>
