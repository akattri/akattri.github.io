<footer class="site-footer" role="contentinfo">
  <div class="container">
    <div>
      <span>{{ .Site.Params.author | upper }} &mdash; {{ now.Format "2006" }}</span> · 
      <span>Built with Hugo · Hosted on GitHub Pages</span>
    </div>

    <ul class="footer-links">
      <li><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="{{ .Site.Params.email }}">Email</a></li>
      <li><a href="{{ "index.xml" | relURL }}">RSS</a></li>
    </ul>
  </div>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      var sun = document.getElementById('sun-icon');
      var moon = document.getElementById('moon-icon');

      function syncThemeState() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (sun && moon) {
          sun.style.display = isDark ? 'block' : 'none';
          moon.style.display = isDark ? 'none' : 'block';
        }
      }

      syncThemeState();

      if (toggle) {
        toggle.addEventListener('click', function() {
          var current = document.documentElement.getAttribute('data-theme');
          var target = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', target);
          try {
            localStorage.setItem('theme', target);
          } catch(e) {}
          syncThemeState();
        });
      }

      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            syncThemeState();
          }
        });
      } catch(e) {}
    })();
  </script>
</footer>
